# Runtime C para a Rinha. Mantém a topologia exigida: 1 LB + 2 APIs,
# rede bridge e soma de recursos dentro de 1 CPU / 350 MB.

services:
  lb:
    image: rinha-backend-2026-c-try:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      platforms: ["linux/amd64"]
    command: ["/usr/local/bin/lb"]
    cpuset: "2,3"
    environment:
      LB_PORT: "9999"
      LB_BACKLOG: "65535"
      LB_ACCEPT_BATCH: "64"
      API_SOCKETS: "/sockets/api1.sock,/sockets/api2.sock"
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    networks: [rinha]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.02", memory: "8MB" }

  api1:
    image: rinha-backend-2026-c-try:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      platforms: ["linux/amd64"]
    command: ["/usr/local/bin/api"]
    cpuset: "0"
    environment:
      API_SOCKET: "/sockets/api1.sock"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "10"
      REPAIR_PROBE: "48"
      REPAIR_CANDIDATES: "0"
      REPAIR_MIN: "1"
      REPAIR_MAX: "4"
      CONN_POOL_CAP: "512"
      EPOLL_SPIN_US: "0"
      EPOLL_IDLE_US: "40"
      EPOLL_BUSY_POLL_US: "5"
      EPOLL_BUSY_POLL_BUDGET: "8"
      EPOLL_PREFER_BUSY_POLL: "0"
      SO_BUSY_POLL_US: "0"
    volumes:
      - sockets:/sockets
    networks: [rinha]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
      memlock: { soft: -1, hard: -1 }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.49", memory: "169MB" }

  api2:
    image: rinha-backend-2026-c-try:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      platforms: ["linux/amd64"]
    command: ["/usr/local/bin/api"]
    cpuset: "1"
    environment:
      API_SOCKET: "/sockets/api2.sock"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "10"
      REPAIR_PROBE: "48"
      REPAIR_CANDIDATES: "0"
      REPAIR_MIN: "1"
      REPAIR_MAX: "4"
      CONN_POOL_CAP: "512"
      EPOLL_SPIN_US: "0"
      EPOLL_IDLE_US: "40"
      EPOLL_BUSY_POLL_US: "5"
      EPOLL_BUSY_POLL_BUDGET: "8"
      EPOLL_PREFER_BUSY_POLL: "0"
      SO_BUSY_POLL_US: "0"
    volumes:
      - sockets:/sockets
    networks: [rinha]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
      memlock: { soft: -1, hard: -1 }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.49", memory: "169MB" }

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"
